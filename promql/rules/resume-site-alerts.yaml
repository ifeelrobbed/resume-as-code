# Alerting rules as code (see resume-site-rules.yaml's comment on why this
# lives in promql/rules/, not manifests/). Everything here was already being
# collected before this file existed - alerting is just finally giving it
# somewhere to go (see kube-prometheus-stack/application.yaml's Discord
# receiver).
#
# Unit-tested in promql/tests/resume-site-alerts_test.yaml - `make promql-test`.
# Editing thresholds or matchers here without updating those tests will fail
# CI, which is the point.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resume-site-alerts
  namespace: resume-site
spec:
  groups:
    - name: resume-site.alerts
      rules:
        # Two consecutive failed probes (1m interval - see
        # prometheus-blackbox-exporter/probe.yaml), not one, so a single
        # transient blip doesn't page.
        - alert: ResumeSiteDown
          expr: probe_success{target="resume-site"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "robertjcameron.com is unreachable from outside the cluster"
            description: "blackbox_exporter's probe of https://robertjcameron.com has failed for 2+ minutes."

        - alert: ResumeSiteCertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry{target="resume-site"} - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "robertjcameron.com's TLS cert expires in under 14 days"
            description: "cert-manager's letsencrypt-prod renewal should handle this automatically - alerting in case it doesn't."

        # error_ratio5m has no data at all during error-free periods (see
        # resume-site-rules.yaml's comment) - so this simply never
        # evaluates true, not "evaluates to 0", when things are healthy.
        - alert: ResumeSiteElevatedErrorRate
          expr: resume_site:http_requests:error_ratio5m > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "resume-site 5xx rate above 5% for 10+ minutes"
            description: "resume_site:http_requests:error_ratio5m is {{ $value | humanizePercentage }}."

        # Covers ingress-nginx, all three cert-manager components and Argo CD's
        # application-controller in one rule via the job label - each becomes
        # its own alert instance.
        #
        # The controller is in here for a specific reason: it is the only thing
        # exporting argocd_app_info, and the two Argo alerts below are triggered
        # by a series *existing*. If the controller stops being scraped, those
        # series vanish and both alerts go quiet - which is indistinguishable
        # from everything being healthy. Absence of data can't alert on itself,
        # so this rule is what covers that gap (the same reasoning as the app's
        # `or vector(0)`, see livestats.go).
        - alert: PlatformComponentDown
          expr: up{job=~"cert-manager|cainjector|webhook|ingress-nginx-controller-metrics|argocd-application-controller-metrics"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} has been unscrapeable for 5+ minutes"
            description: "Prometheus can't reach {{ $labels.job }} - either the pod is down or its ServiceMonitor/metrics endpoint broke."

        # Distinct from ResumeSiteDown: this fires if Prometheus can't
        # scrape the app pod's own /metrics, which is a different failure
        # mode than the external probe failing (e.g. a broken
        # ServiceMonitor vs. the site actually being down).
        - alert: ResumeSiteMetricsUnreachable
          expr: up{job="resume-site"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus can't scrape resume-site's own /metrics"
            description: "up{job=\"resume-site\"} has been 0 for 5+ minutes - check the pod and its ServiceMonitor."

        # Argo CD sync/health, from the same argocd_app_info the site's sync
        # panel reads (#43) - so the panel going amber and this firing are the
        # same signal reaching two different audiences.
        #
        # Both rules alert on a series EXISTING rather than on a value.
        # sync_status and health_status are labels, not values, and the gauge is
        # hard-coded to 1 - so a state change replaces the series instead of
        # changing a number, and `== 1` would be decoration that never filters
        # anything. The matcher is the whole condition.
        #
        # That has a consequence worth knowing at 3am: because a state change is
        # a *new* series, the `for:` clock restarts on every transition. An app
        # flapping between two unhealthy states resets it each time and never
        # fires. Steady-state breakage is what these catch; flapping is left to
        # the health rule's Progressing exclusion and to the dashboard.
        #
        # 15m is chosen against how the cluster actually behaves rather than
        # picked round: reconciliation is 120s (argocd-cm timeout.reconciliation)
        # and every application has selfHeal=true, so routine drift - including
        # the OutOfSync window after every image-bump merge - closes in about two
        # minutes plus sync time. Still drifted at 15 minutes means the sync
        # itself is failing, which is worth a Discord notification rather than
        # something to find out about later.
        - alert: ArgoApplicationOutOfSync
          expr: argocd_app_info{sync_status!="Synced"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} has been {{ $labels.sync_status }} for 15+ minutes"
            description: "selfHeal is enabled and reconciliation runs every 120s, so drift normally clears in minutes - this long means the sync is failing, not pending. Check the application's conditions."

        # Excludes three states deliberately. Progressing is what a healthy
        # rollout looks like. Suspended is somebody's decision, not a fault.
        # Healthy is the goal. Everything else - Degraded, Missing, Unknown -
        # fires.
        #
        # Written as a negative matcher on purpose: Argo's health states are a
        # documented enum today, but a positive list would silently never alert
        # on a state added in a future upgrade. A new state paging once is a
        # better failure than a new state being invisible.
        - alert: ArgoApplicationUnhealthy
          expr: argocd_app_info{health_status!~"Healthy|Progressing|Suspended"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is {{ $labels.health_status }}"
            description: "The application's resources have been unhealthy for 15+ minutes - a rollout that never became ready, or resources that went missing underneath Argo CD."
