# Referenced by name from kube-prometheus-stack/application.yaml's
# alertmanager.alertmanagerSpec.alertmanagerConfiguration - must live in the
# same namespace as the Alertmanager object itself (monitoring), which is
# also what makes the operator skip the namespace-matcher injection it'd
# otherwise apply to a first-level route (see the comment in that file).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: resume-site-discord
  namespace: monitoring
spec:
  route:
    receiver: discord
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    # Watchdog is the chart's dead-man's-switch: it fires permanently, by
    # design, so that its *absence* means something. The chart's raw `config:`
    # value silenced it with a "null" route, since a dead man's switch with no
    # external consumer is just noise - and bypassing that value meant the
    # silencing had to be redone explicitly here (#139).
    #
    # There is an external consumer now, so it is routed rather than
    # discarded. Sending it to healthchecks.io inverts the direction of the
    # only gap the in-cluster blackbox exporter structurally cannot cover:
    # nothing probes in, the cluster pings out, and the alarm is the ping not
    # arriving. An outage that takes the prober down with it - the exact case
    # blackbox misses, because it lives in the cluster it watches - now has
    # something outside the cluster noticing.
    #
    # groupInterval/repeatInterval are set here rather than inherited: the
    # parent's 4h is right for real alerts reaching Discord and far too slow
    # for a heartbeat, which would make detection 4h + grace. A ping every
    # 10m against 30m of grace at healthchecks.io detects a dead cluster
    # inside ~40 minutes while leaving roughly 3.5x margin over the ~8
    # minutes Alertmanager was actually unavailable during the node reimage
    # in #140. That margin is the point: too tight a grace turns every
    # routine node upgrade into a page, which is the problem #139 just
    # finished removing.
    #
    # repeatInterval is 9m, not the 10m that cadence implies, and the
    # difference is load-bearing. The dispatcher only reconsiders a group on
    # groupInterval ticks, and at each one asks whether repeatInterval has
    # elapsed since the last notification - but "last" is stamped after the
    # webhook round-trip returns, so it lands a few milliseconds past the
    # tick it was sent on. At the 10m tick the elapsed time is therefore
    # 10m minus that delta, just short of a 10m repeatInterval, so the check
    # fails and the ping slips to the 15m tick. Measured at a flat 15.0m
    # before this was changed - not jitter, since any repeatInterval that is
    # an exact multiple of groupInterval misses by the same delta every time
    # and slips one tick, permanently.
    #
    # 9m clears the 10m tick with a full minute of headroom against a delta
    # measured in milliseconds. Anything strictly between groupInterval and
    # 2x groupInterval works; the value only has to avoid landing on a tick
    # boundary. Changing groupInterval means revisiting this.
    #
    # Kept as a separate entry from the InfoInhibitor route below rather than
    # merged into one `alertname =~ ...` matcher - they now go to different
    # receivers, so there was never anything to merge.
    routes:
      - receiver: heartbeat
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "="
        groupInterval: 5m
        repeatInterval: 9m
      # InfoInhibitor is plumbing for the inhibitRules below, not an alert -
      # its own annotation says it "should be routed to a null receiver".
      # Upstream silences it differently: not via this route at all, but with
      # a fourth, source-less inhibit rule (`target_matchers: [alertname =
      # InfoInhibitor]` and nothing else), which lets any firing alert inhibit
      # it - permanently, in practice, because Watchdog always fires. That is
      # indirect enough to be worth replacing with an explicit route: this
      # does not quietly stop working if Watchdog is ever silenced or
      # disabled. Routing Watchdog to the heartbeat above does not itself
      # affect that - it still fires, so it would still inhibit - but it does
      # turn Watchdog's configuration into something that gets edited rather
      # than a constant, which is exactly when an indirect dependency breaks.
      #
      # Routing it to "null" does not affect its use as an inhibition source
      # in rule 3 below - inhibition is evaluated over the firing alert set,
      # independently of which receiver an alert routes to.
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: "="
  receivers:
    - name: "null"
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook-url

    # sendResolved is false, and that is the whole correctness argument for
    # this receiver. A plain POST to an hc-ping.com URL means "healthy". If
    # Watchdog ever stops firing, Alertmanager would - with sendResolved true
    # - POST a resolved notification, which healthchecks.io cannot tell apart
    # from a normal heartbeat. The switch would report success at precisely
    # the moment it was dying. Silence has to stay the only signal.
    #
    # urlSecret rather than url: the ping URL is a bearer credential, and
    # anyone holding it can suppress the alarm by pinging it themselves.
    # Referenced by Secret the same way the Discord webhook is, so it never
    # lands in this repo. Unlike that one it is NOT added to
    # alertmanagerSpec.secrets - the operator resolves a SecretKeySelector
    # through the API and inlines the value into the generated config, so no
    # pod mount is involved (confirmed by the Discord URL already appearing
    # inlined there).
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: alertmanager-healthchecks-heartbeat
            key: url
          sendResolved: false

  # Lost the same way the Watchdog route was, except these were never re-added
  # and had been missing since the switch to alertmanagerConfiguration (#139).
  # The chart ships four inhibit_rules in its raw `config:` value, and
  # bypassing that value dropped all four. Without them every severity of the
  # same underlying problem notifies separately - a critical alert arrives
  # alongside its own warning and info duplicates - and InfoInhibitor, which
  # exists solely to drive rule 3, had nothing to drive and simply paged.
  #
  # Three of the four are reproduced here. The fourth silences InfoInhibitor
  # itself, which the explicit "null" route above now does directly - see the
  # comment on that route for why the route is preferred to the rule.
  #
  # Field names are the CRD's, not the raw config's: sourceMatch/targetMatch
  # here vs source_matchers/target_matchers in Alertmanager's own YAML. Same
  # semantics, different spelling - checked against the CRD's openAPI schema
  # rather than transcribed from upstream's values.yaml.
  inhibitRules:
    # 1. A critical alert suppresses the warning and info versions of itself.
    #    equal on both namespace AND alertname, so this only ever collapses
    #    duplicate severities of one alert, never two different problems that
    #    happen to share a namespace.
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: warning|info
          matchType: "=~"
      equal: ["namespace", "alertname"]

    # 2. Same idea one severity down.
    - sourceMatch:
        - name: severity
          value: warning
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: ["namespace", "alertname"]

    # 3. The rule InfoInhibitor exists for, and the reason it is worth keeping
    #    the alert at all. It fires for any namespace that has a severity=info
    #    alert and no warning/critical alongside it; this then suppresses that
    #    namespace's info alerts. Net effect: info-level alerts notify only
    #    when something more serious in the same namespace corroborates them.
    #    equal is namespace only - unlike 1 and 2, this deliberately spans
    #    different alertnames, since the point is "nothing else is wrong here".
    - sourceMatch:
        - name: alertname
          value: InfoInhibitor
          matchType: "="
      targetMatch:
        - name: severity
          value: info
          matchType: "="
      equal: ["namespace"]
