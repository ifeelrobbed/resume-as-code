apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.2.0 # app version v0.93.0
    helm:
      values: |
        # Routes to a Discord webhook. The credential itself is NOT here -
        # it's a one-off `kubectl create secret` (alertmanager-discord-
        # webhook, monitoring namespace), not committed to git, since this
        # repo has no secrets management (Key Vault/CSI driver) yet - see
        # ARCHITECTURE.md's Secrets section. Migrate to Key Vault/CSI once
        # that exists.
        #
        # Routing/receivers live in a native AlertmanagerConfig object
        # (kube-prometheus-stack/alertmanager-config.yaml), not the raw
        # `config:` value some guides use - discord_config's webhook_url_file
        # isn't recognized by this operator version's config parser
        # ("field webhook_url_file not found in type alertmanager.
        # discordConfig", confirmed against the live cluster), even though
        # the underlying Alertmanager binary itself supports it.
        # AlertmanagerConfig's discordConfigs[].apiURL is a proper
        # SecretKeySelector - references the Secret by name/key directly,
        # no file-mount indirection, and isn't subject to that gap.
        alertmanager:
          enabled: true
          alertmanagerSpec:
            secrets:
              - alertmanager-discord-webhook
            # Makes alertmanager-config.yaml (same namespace as this
            # Alertmanager object) THE config, rather than one of several
            # merged tenant configs - deliberately, since the latter path
            # auto-injects a `namespace: monitoring` matcher on the first-
            # level route, which would silently stop it from ever matching
            # alerts from resume-site's own PrometheusRule (a different
            # namespace). alertmanagerConfigMatcherStrategy: None makes
            # that explicit rather than relying on this one mechanism's
            # documented-but-easy-to-miss side effect.
            alertmanagerConfiguration:
              name: resume-site-discord
            alertmanagerConfigMatcherStrategy:
              type: None
            resources:
              requests:
                cpu: 50m
                memory: 64Mi

        # AKS's control plane is fully Azure-managed - these components
        # aren't reachable the way the chart's defaults (built for
        # self-hosted/kubeadm clusters) assume, so their ServiceMonitors
        # never find a target and the chart's own KubeControllerManagerDown/
        # KubeSchedulerDown/KubeProxyDown/etcd alerts fire permanently as
        # false positives. Was already true since this chart was first
        # installed - only surfaced now that Alertmanager actually has
        # somewhere to send notifications. kubeApiServer stays on: unlike
        # these, the API server genuinely is reachable and already
        # confirmed scraping successfully (job "apiserver").
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        prometheusOperator:
          admissionWebhooks:
            # cert-manager (platform/cert-manager) is already running -
            # let it issue the operator's webhook cert instead of the
            # chart's default self-signed-via-Helm-hook-Job, which fights
            # Argo CD's selfHeal on every re-sync.
            certManager:
              enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

        prometheus:
          prometheusSpec:
            retention: 15d
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: managed-csi
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 15Gi
            # Chart default only matches ServiceMonitors/PodMonitors/Probes/
            # Rules carrying its own release label, in its own namespace -
            # opens discovery cluster-wide so e.g. resume-site's
            # ServiceMonitor (different namespace, no release label)
            # actually gets scraped. Got bitten by this once already
            # (resume-site's own ServiceMonitor sat unscraped for days
            # despite this comment already existing) - probeSelector is
            # included pre-emptively here for prometheus-blackbox-exporter's
            # Probe, rather than waiting to discover it's missing again.
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorNamespaceSelector: {}
            probeSelectorNilUsesHelmValues: false
            probeNamespaceSelector: {}
            ruleSelectorNilUsesHelmValues: false
            ruleNamespaceSelector: {}

        grafana:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          # Dashboards/datasources still come entirely from the chart's
          # ConfigMap sidecar (unaffected by this) - this PVC is only for
          # Grafana's own SQLite database (orgs, users, and critically any
          # Public Dashboard share config), which lives at /var/lib/grafana
          # and was on an emptyDir - wiped on every pod restart, which would
          # silently break/regenerate any public dashboard link. 1Gi is
          # generous; that DB is a few MB at this scale. type: sts converts
          # the workload from Deployment to StatefulSet, required for a
          # persistence.enabled Grafana to actually get a real
          # volumeClaimTemplate instead of a same-emptyDir no-op - confirmed
          # via `helm template` before writing this.
          persistence:
            enabled: true
            type: sts
            storageClassName: managed-csi
            accessModes:
              - ReadWriteOnce
            size: 1Gi
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.robertjcameron.com
            tls:
              - hosts:
                  - grafana.robertjcameron.com
                secretName: grafana-tls

        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # cainjector patches the webhook configs' caBundle out-of-band after
  # install, same as cert-manager's own webhooks (see
  # platform/cert-manager/application.yaml) - without this it perpetually
  # (and falsely) reports OutOfSync.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus/Alertmanager CRDs are large enough to exceed
      # client-side apply's last-applied-configuration annotation cap
      # (262144 bytes) - same issue noted in
      # platform/argocd/application.yaml for the applicationset CRD.
      - ServerSideApply=true
