apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.2.0 # app version v0.93.0
    helm:
      values: |
        # Routes to a Discord webhook. The webhook URL itself is NOT here -
        # it's a one-off `kubectl create secret` (alertmanager-discord-
        # webhook, monitoring namespace), not committed to git, since this
        # repo has no secrets management (Key Vault/CSI driver) yet - see
        # ARCHITECTURE.md's Secrets section. Referenced here only via
        # webhook_url_file, pointing at where alertmanagerSpec.secrets
        # mounts that Secret. Migrate to Key Vault/CSI once that exists.
        alertmanager:
          enabled: true
          alertmanagerSpec:
            secrets:
              - alertmanager-discord-webhook
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
          config:
            route:
              receiver: discord
              group_by: ["alertname"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
            # "null" isn't optional here even though nothing routes to it
            # directly: the chart deep-merges its own base route.routes
            # (not shown here - it's hardcoded in the chart's templates)
            # into whatever route we set, and that base config always
            # includes a Watchdog-alert -> "null" sub-route to silence the
            # chart's built-in dead-man's-switch alert. Helm replaces lists
            # wholesale rather than merging them, so specifying receivers
            # here drops the chart's own "null" receiver definition while
            # that Watchdog sub-route still references it by name - without
            # this entry the operator rejects the whole config as invalid
            # ("undefined receiver \"null\" used in route") and no
            # Alertmanager StatefulSet gets created at all.
            receivers:
              - name: "null"
              - name: discord
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook-url

        prometheusOperator:
          admissionWebhooks:
            # cert-manager (platform/cert-manager) is already running -
            # let it issue the operator's webhook cert instead of the
            # chart's default self-signed-via-Helm-hook-Job, which fights
            # Argo CD's selfHeal on every re-sync.
            certManager:
              enabled: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

        prometheus:
          prometheusSpec:
            retention: 15d
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: managed-csi
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 15Gi
            # Chart default only matches ServiceMonitors/PodMonitors/Probes/
            # Rules carrying its own release label, in its own namespace -
            # opens discovery cluster-wide so e.g. resume-site's
            # ServiceMonitor (different namespace, no release label)
            # actually gets scraped. Got bitten by this once already
            # (resume-site's own ServiceMonitor sat unscraped for days
            # despite this comment already existing) - probeSelector is
            # included pre-emptively here for prometheus-blackbox-exporter's
            # Probe, rather than waiting to discover it's missing again.
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorNamespaceSelector: {}
            probeSelectorNilUsesHelmValues: false
            probeNamespaceSelector: {}
            ruleSelectorNilUsesHelmValues: false
            ruleNamespaceSelector: {}

        grafana:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          # No persistence - dashboards/datasources are provisioned via the
          # chart's ConfigMap sidecar (ships enabled by default), so Grafana
          # stays stateless and reproducible on redeploy instead of relying
          # on manually-created dashboards surviving a pod restart.
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.robertjcameron.com
            tls:
              - hosts:
                  - grafana.robertjcameron.com
                secretName: grafana-tls

        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi

        prometheus-node-exporter:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # cainjector patches the webhook configs' caBundle out-of-band after
  # install, same as cert-manager's own webhooks (see
  # platform/cert-manager/application.yaml) - without this it perpetually
  # (and falsely) reports OutOfSync.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The Prometheus/Alertmanager CRDs are large enough to exceed
      # client-side apply's last-applied-configuration annotation cap
      # (262144 bytes) - same issue noted in
      # platform/argocd/application.yaml for the applicationset CRD.
      - ServerSideApply=true
