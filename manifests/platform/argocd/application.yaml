# Argo CD manages its own upgrades from here on - bump targetRevision in a
# PR to upgrade instead of re-running the bootstrap script.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.2.2 # app version v3.4.6, matching bootstrap/install-argocd.sh
    helm:
      values: |
        # Chart bug (10.2.2): the redis pod's secret-init container defaults
        # to the "default" ServiceAccount, which has no RBAC and fails with
        # "secrets is forbidden". Point it at the ServiceAccount the chart's
        # own redisSecretInit hook already creates with the right Role.
        redis:
          serviceAccount:
            name: argocd-redis-secret-init

        # Scrape the application-controller so sync state becomes queryable
        # (#43). argocd_app_info carries sync_status and health_status as
        # labels, one series per Application, which is what lets the site show
        # real sync state instead of the hardcoded "Synced - Healthy" placeholder
        # it has displayed since launch.
        #
        # The controller has always served these on port 8082 - metrics.enabled
        # only controls whether a Service and ServiceMonitor get created, so
        # nothing was collecting them.
        #
        # Controller only. The server and repo-server also expose metrics, but
        # they are mostly request latencies nothing here queries, and #73 just
        # spent effort removing series that nothing queried.
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The applicationset CRD is too large for client-side apply's
      # last-applied-configuration annotation (262144-byte cap) - hit this
      # for real during the imperative bootstrap too.
      - ServerSideApply=true
