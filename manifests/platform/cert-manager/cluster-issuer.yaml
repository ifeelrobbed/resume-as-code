# Two issuers: use letsencrypt-staging while testing an Ingress/Certificate
# end-to-end (untrusted cert, but no rate limit risk), then switch the
# Ingress's cert-manager.io/cluster-issuer annotation to letsencrypt-prod
# once it's confirmed working - production has a 5-certs-per-domain-per-week
# limit that's easy to burn through while debugging.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: cameronrj@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: cameronrj@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
