apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1 # app version 1.15.1
    helm:
      values: |
        controller:
          # 1 replica: the cluster is a single node, a 2nd replica would
          # just be unschedulable or share the node for no real HA benefit.
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          service:
            annotations:
              # Pin the Service to the static IP Terraform manages
              # (infra/envs/prod, azurerm_public_ip.ingress) instead of
              # letting the cloud-provider create/own an ephemeral one tied
              # to this Service's lifecycle. DNS (robertjcameron.com) points
              # at this address.
              service.beta.kubernetes.io/azure-pip-name: pip-resume-site-prod-ingress
              service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-resume-site-prod-aks-nodes
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
