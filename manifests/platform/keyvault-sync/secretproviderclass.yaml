# Maps Key Vault secrets to the Kubernetes Secrets that monitoring consumes
# (#145). The Secret names and keys are the ones the hand-created Secrets
# used, so alertmanager-config.yaml's SecretKeySelectors did not change.
#
# The three GUIDs and names below come from Terraform. Hardcoded because a
# plain-directory Argo CD source has no templating - read current values with:
#   terraform -chdir=infra/envs/prod output -raw key_vault_name
#   terraform -chdir=infra/envs/prod output -raw keyvault_sync_identity_client_id
#   terraform -chdir=infra/envs/prod output -raw tenant_id
# None of them is a credential. The client ID changes only if the identity is
# recreated, which a cluster rebuild does not do - it lives in the app
# resource group - and a stale value fails as a token-exchange error in the
# keyvault-sync pod's events.
#
# Adding a secret is three steps: `az keyvault secret set` (BOOTSTRAP.md
# section 6), an entry under objects, and an entry under secretObjects.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: monitoring-keyvault
  namespace: monitoring
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: 62e9a4d2-a88b-4f3d-aefa-3553bd90c9fb
    keyvaultName: kv-resume-site-prod
    tenantId: 0356085d-0e38-47d2-aa27-62f9508fe252
    objects: |
      array:
        - |
          objectName: alertmanager-discord-webhook
          objectType: secret
        - |
          objectName: alertmanager-healthchecks-heartbeat
          objectType: secret
  # What the driver writes into Kubernetes Secrets, beyond the files it mounts
  # into the pod. This half is the reason the driver is here at all: the
  # Alertmanager operator resolves SecretKeySelectors through the API and has
  # no use for a mounted file.
  #
  # The driver will not adopt an existing Secret of the same name. Its create
  # treats "already exists" as success, and its caches only see Secrets
  # labelled secrets-store.csi.k8s.io/managed=true, so a pre-existing Secret is
  # left untouched and never rotated - with nothing reporting it. Migrating a
  # hand-created Secret means deleting it and restarting keyvault-sync; see
  # BOOTSTRAP.md section 6.
  secretObjects:
    - secretName: alertmanager-discord-webhook
      type: Opaque
      data:
        - objectName: alertmanager-discord-webhook
          key: webhook-url
    - secretName: alertmanager-healthchecks-heartbeat
      type: Opaque
      data:
        - objectName: alertmanager-healthchecks-heartbeat
          key: url
