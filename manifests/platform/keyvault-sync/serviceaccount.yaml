# The identity the keyvault-sync pod runs as, and through it the only thing in
# the cluster that can read kv-resume-site-prod (#145).
#
# The name is load-bearing. infra/envs/prod/key-vault.tf's federated
# credential trusts exactly system:serviceaccount:monitoring:keyvault-sync -
# namespace and name both. A mismatch surfaces as a token-exchange failure in
# the pod's mount events that reads like a permissions problem.
#
# No azure.workload.identity/client-id annotation, unlike
# ServiceAccount/resume-site. That annotation is read by the workload identity
# webhook to configure an SDK inside the pod, and nothing in this pod uses an
# SDK. The Azure provider takes the client ID from the SecretProviderClass
# alone (types.GetClientID, provider v1.8.2), so annotating here would only be
# a second copy of the GUID to go stale.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keyvault-sync
  namespace: monitoring
# The CSI driver gets this ServiceAccount's token from the kubelet through the
# CSIDriver object's tokenRequests (audience api://AzureADTokenExchange), not
# from a mounted token, so the pod itself never needs API access.
automountServiceAccountToken: false
