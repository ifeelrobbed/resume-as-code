# The one app-of-apps entry point. Applied once by bootstrap/install-argocd.sh;
# from then on it's self-managing, since it lives inside the directory tree
# it watches.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ifeelrobbed/resume-as-code.git
    targetRevision: master
    path: manifests
    directory:
      recurse: true
      # Each app's actual workload manifests (e.g. apps/resume-site/deploy/)
      # are synced by that app's own Application, not by root directly -
      # without this, root would apply them a second time itself (into the
      # wrong namespace, root's own) as plain recursed resources.
      exclude: "apps/*/deploy/**"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
