# The one app-of-apps entry point. Applied once by bootstrap/install-argocd.sh;
# from then on it's self-managing, since it lives inside the directory tree
# it watches (both directories below, not just manifests/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source (spec.sources, not spec.source) so root also watches
  # promql/ (see ARCHITECTURE.md's repo layout) - recording/alerting rules
  # as code, kept out of manifests/ since they're not infra/platform
  # config in the same sense everything else under manifests/ is.
  #
  # Pointed at promql/rules specifically, not promql/. Its sibling
  # promql/tests holds promtool unit tests for these rules, which are plain
  # YAML with no apiVersion/kind - syncing those would fail to apply and leave
  # root permanently OutOfSync, which the ArgoApplicationOutOfSync alert
  # defined in this very directory would then fire on.
  sources:
    - repoURL: https://github.com/ifeelrobbed/resume-as-code.git
      targetRevision: master
      path: manifests
      directory:
        recurse: true
        # Each app's actual workload manifests (e.g. apps/resume-site/deploy/)
        # are synced by that app's own Application, not by root directly -
        # without this, root would apply them a second time itself (into the
        # wrong namespace, root's own) as plain recursed resources.
        exclude: "apps/*/deploy/**"
    - repoURL: https://github.com/ifeelrobbed/resume-as-code.git
      targetRevision: master
      path: promql/rules
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
