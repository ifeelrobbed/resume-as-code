# Default-deny ingress for the resume-site namespace, plus the two sources that
# legitimately reach the app (#58). Enforced by Calico - see
# infra/modules/aks/main.tf. Before that engine existed these objects would have
# been accepted by the API server and enforced by nobody, which is exactly the
# gap this issue was opened for.
#
# Ingress only, deliberately. The app's egress is DNS, Prometheus, and Azure
# Blob Storage over the public internet; a default-deny egress ending in "allow
# 443 to anywhere" restricts almost nothing while adding a way to silently break
# the visitor counter. Revisit if egress ever becomes worth constraining
# properly.
#
# Nothing here accommodates kubelet probes, and nothing needs to. Verified
# empirically on this cluster before writing these: under a default-deny ingress
# policy a pod with readiness and liveness probes stayed ready with zero
# restarts across ~15 probe cycles, while pod-to-pod traffic to the same port
# was dropped. Calico exempts host-to-pod traffic. Both halves of that test
# mattered - probes passing on their own would only have proved the policy
# wasn't being enforced.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: resume-site
spec:
  # Every pod in the namespace. Today that is one Deployment; writing it as a
  # blanket selector means anything added later is denied by default rather
  # than silently exempt.
  podSelector: {}
  policyTypes:
    - Ingress
---
# Real visitor traffic: DNS -> Azure LB -> ingress-nginx -> here. The blackbox
# exporter's uptime probe arrives this way too, since it targets the public URL
# rather than the pod, so it needs no rule of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: resume-site
spec:
  podSelector:
    matchLabels:
      app: resume-site
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Matched by namespace rather than by pod label. A podSelector would be
        # tighter, but it would bind this policy to labels the ingress-nginx
        # chart owns and can change on any version bump - and the failure mode
        # is the site going dark with nothing pointing here. Only the
        # controller runs in that namespace, so the practical difference is
        # small. Same reasoning as matching the blackbox exporter's user agent
        # by prefix rather than exact version (app/metrics.go).
        #
        # kubernetes.io/metadata.name is set and maintained by Kubernetes on
        # every namespace, so it cannot drift the way an applied label can.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        # The container port, not the Service port. The Service maps 80 -> 8080
        # but policy is evaluated against the pod.
        - protocol: TCP
          port: 8080
---
# Prometheus scrapes /metrics directly on the pod, via the ServiceMonitor in
# manifests/platform/kube-prometheus-stack. Without this rule the scrape is
# dropped, up{job="resume-site"} goes to 0, and ResumeSiteMetricsUnreachable
# fires - which is at least a loud failure rather than a silent one.
#
# Port 9090, the admin listener, not 8080. That listener serves only /metrics,
# so this rule now grants reachability to exactly the endpoint Prometheus needs
# and nothing else - previously it opened the whole public surface to the
# monitoring namespace as a side effect of them sharing a port (#76).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: resume-site
spec:
  podSelector:
    matchLabels:
      app: resume-site
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
# Let's Encrypt HTTP-01 challenges. cert-manager answers a challenge by creating
# a short-lived solver pod plus its own Ingress for
# /.well-known/acme-challenge/<token>, in the same namespace as the Certificate -
# so the solver lands here, where default-deny-ingress above catches it.
#
# That is precisely the case its podSelector comment anticipated: "anything added
# later is denied by default rather than silently exempt". The solver is added
# later, by a controller rather than by hand, which is why it was not obvious.
#
# Without this rule the request reaches ingress-nginx, which routes it correctly
# to the solver and then cannot connect - so the visible symptom is a 504 from
# nginx on the challenge URL, and cert-manager reports its own self check timing
# out. Neither names a NetworkPolicy, which is what made this expensive to
# attribute (found while adding the www SAN in #135).
#
# The consequence was not limited to new names: this broke every future issuance
# from the moment the policies landed (2026-08-29). Nothing needed issuing in
# between, so it stayed invisible. The current certificate is valid to
# 2026-11-02 and renews at 2026-10-03, and that renewal would have failed the
# same way - silently, then loudly when the certificate expired.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver
  namespace: resume-site
spec:
  # Set by cert-manager on every HTTP-01 solver pod. Unlike the ingress-nginx
  # chart's labels - which allow-ingress-nginx above deliberately avoids binding
  # to - this one is part of how cert-manager's ACME implementation identifies
  # its own solvers, not a packaging detail of a chart, so it is far less likely
  # to move under a version bump.
  #
  # Matching the label rather than a name: solver pods are generated with a
  # random suffix per challenge and exist for a minute or two, so there is no
  # stable name to write down.
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Same source and same reasoning as allow-ingress-nginx: the challenge
        # arrives from the public internet through the ingress controller, not
        # from cert-manager itself.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        # cert-manager's solver listens on 8089. Its Ingress maps 80 -> 8089,
        # and as with the rule above, policy is evaluated against the pod.
        - protocol: TCP
          port: 8089
