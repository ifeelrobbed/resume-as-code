apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-site
  namespace: resume-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Pins a reader to one replica for the length of their visit, which the
    # visitor count needs and nothing else here does. Each pod holds its own
    # unflushed visits (see visitorCounter in app/visitors.go), so the two
    # display totals differing by a handful between flushes is expected - but a
    # reader bounced between them mid-refresh would watch the number go
    # *backwards*, on the one panel whose whole claim is that it is live.
    #
    # This does not make the pods agree; #151 keeps them converging by
    # re-reading the stored total every flush interval. It makes one reader's
    # view monotonic, which is the part that is visible.
    #
    # Set on the Ingress rather than as the Service's sessionAffinity: ClientIP
    # would do nothing here, because ingress-nginx proxies straight to pod IPs
    # and never goes through the Service's kube-proxy rules.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    # balanced, not persistent: persistent keeps a reader pinned to a pod even
    # as endpoints change, which during a drain means pinning them to the pod
    # that is going away. balanced re-hashes when the backend set changes,
    # which is the behaviour wanted during exactly the node reimage this whole
    # change exists to survive.
    nginx.ingress.kubernetes.io/affinity-mode: "balanced"
    nginx.ingress.kubernetes.io/session-cookie-name: "resume-site-backend"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    # Deliberately no session-cookie-max-age or -expires, which makes this a
    # session cookie: it holds no identifier, is read only by nginx to pick a
    # backend, and is gone when the browser closes. Persisting it across
    # sessions would buy nothing - the jitter it exists to hide only happens
    # within a single sitting - while turning a strictly-functional cookie into
    # something a visitor might reasonably want told about.
spec:
  ingressClassName: nginx
  # www has to be on the certificate because TLS is negotiated before anything
  # can look at a Host header - without it, https://www fails in the handshake
  # and the visitor sees a certificate warning rather than a redirect.
  #
  # cert-manager builds the Certificate's dnsNames from this list, so listing
  # the name here is what triggers reissue. The solver is http01 (see
  # manifests/platform/cert-manager/cluster-issuer.yaml), so the www DNS record
  # must resolve to this ingress before this is applied, or the challenge is
  # unreachable.
  tls:
    - hosts:
        - robertjcameron.com
        - www.robertjcameron.com
      secretName: resume-site-tls
  # Both hosts route to the same Service, and the app answers www with a 308 to
  # the apex (see canonicalHostRedirect in app/main.go). The redirect is in the
  # app rather than on this Ingress because neither nginx annotation for the job
  # works here: from-to-www-redirect swallows the ACME challenge for www and
  # drops the token from the path (#135, reverted), and permanent-redirect sends
  # every path to one fixed URL, which would land www/resume on the homepage.
  #
  # Routing www to the app rather than redirecting at the edge costs one extra
  # hop into a handler that does nothing but set a Location header, and buys a
  # redirect that is unit-tested and preserves the path.
  rules:
    - host: robertjcameron.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-site
                port:
                  number: 80
    - host: www.robertjcameron.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-site
                port:
                  number: 80
