# The identity the pod runs as, so it can exchange a projected token for an
# Azure one and reach the visitor-count blob without any stored credential
# (#75).
#
# Dedicated rather than reusing "default": default is what every pod in this
# namespace gets when it names none, so annotating that one would silently hand
# an Azure identity to anything deployed here later. This makes the grant belong
# to this workload.
#
# The name is load-bearing. infra/envs/prod/app-identity.tf's federated
# credential trusts exactly system:serviceaccount:resume-site:resume-site -
# namespace and name both. A mismatch surfaces as an opaque token-exchange
# failure that reads like a permissions problem rather than a typo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resume-site
  namespace: resume-site
  annotations:
    # Client ID of azurerm_user_assigned_identity.app. Hardcoded because a
    # plain-directory Argo CD source has no templating - read the current value
    # with:
    #   terraform -chdir=infra/envs/prod output -raw app_identity_client_id
    # It changes if that identity is ever recreated, and a stale value fails as
    # an opaque token-exchange error rather than anything that names this file.
    azure.workload.identity/client-id: b4721a9d-3590-48e1-b350-3d1f81679f19
# Nothing here talks to the Kubernetes API. Workload identity uses its own
# projected token at /var/run/secrets/azure/tokens, injected by the webhook and
# entirely separate from this - verified before building any of it.
automountServiceAccountToken: false
