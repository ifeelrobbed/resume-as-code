apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-site
  namespace: resume-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-site
  template:
    metadata:
      labels:
        app: resume-site
        # Opts this pod into the workload identity webhook, which injects a
        # projected token at /var/run/secrets/azure/tokens plus the AZURE_*
        # environment the SDK reads. Without it the ServiceAccount annotation
        # is inert and the pod has no way to authenticate to Azure.
        azure.workload.identity/use: "true"
    spec:
      # Paired with the label above and the annotation on this ServiceAccount;
      # all three are required for the token exchange (#75).
      serviceAccountName: resume-site
      # The image already runs as distroless' nonroot user, but nothing here
      # said so - a base image change could have flipped that silently, with
      # no signal. Declaring it makes non-root the cluster's guarantee rather
      # than the Dockerfile's. 65532 is distroless' nonroot uid/gid, read off
      # the published image rather than assumed.
      #
      # Together with the container-level block below this satisfies the
      # restricted Pod Security Standard, which a static Go binary serving
      # HTTP from two read-only directories has no reason not to meet.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Nothing here talks to the Kubernetes API - the app serves HTTP and
      # polls Prometheus over the network. Without this, the pod still gets a
      # mounted API token it has no use for, which is only ever a liability.
      automountServiceAccountToken: false
      # 30s is the Kubernetes default, stated explicitly because the app's
      # shutdown depends on it: on SIGTERM it fails readiness for 6s so this
      # pod leaves the Service's endpoints, then waits up to 20s for in-flight
      # requests. 26s total, so lowering this below ~30 means kubelet SIGKILLs
      # mid-drain and the graceful shutdown achieves nothing. The constants are
      # drainDelay and shutdownTimeout in app/main.go, and a test asserts their
      # sum fits inside this number.
      terminationGracePeriodSeconds: 30
      containers:
        - name: resume-site
          # Rewritten automatically on every merge to master by app-ci's
          # deploy job (.github/workflows/app-ci.yml), which opens and
          # merges a PR bumping this one line - so a deploy is still an
          # auditable PR, just not one anyone has to hand-write. Editing
          # it by hand still works for pinning or rolling back; the next
          # merge touching app/ moves it forward again.
          #
          # That job's rewrite assumes this is the only image: line in the
          # file, and fails loudly rather than guessing if that changes.
          #
          # Release tags (vX.Y.Z) are retagged copies of an already-built
          # sha- image (see app-release.yml) - readable for a human
          # scanning `kubectl get deploy -o yaml`, but unlike a sha- tag,
          # nothing stops the registry tag itself from being overwritten
          # later. Use a sha- tag instead if that mutability ever matters.
          image: ghcr.io/ifeelrobbed/resume-as-code:sha-df5bd31
          ports:
            # Named so the Service and NetworkPolicy read as intent rather
            # than as numbers. containerPort is informational to Kubernetes -
            # what actually binds is app/main.go's publicAddr/metricsAddr, so
            # these two lists have to be kept in step by hand.
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            # The Grafana Public Dashboard share link. Lives here rather than
            # in the Go source because the share token is created by hand
            # against a running Grafana (it isn't provisionable - see
            # BOOTSTRAP.md) and doesn't survive losing Grafana's database, so
            # a cluster rebuild produces a new one. Editing it here is a
            # manifest change; as a Go constant it needed a rebuild (#65).
            #
            # Unset hides the homepage link rather than rendering a dead one,
            # so leaving this blank during a recovery is a safe state.
            - name: GRAFANA_DASHBOARD_URL
              value: "https://grafana.robertjcameron.com/public-dashboards/992c146423e540d5a3c1bcf70f71c6ee"
            # Where the durable visitor count lives (#75). Read from Terraform
            # rather than invented here:
            #   terraform -chdir=infra/envs/prod output -raw app_storage_account_name
            #   terraform -chdir=infra/envs/prod output -raw app_stats_container_name
            #
            # Inert until the app reads them in the next step. Set now so that
            # change is app code and tests only, with no manifest edit riding
            # along with it.
            - name: VISITOR_STORAGE_ACCOUNT
              value: "resumesitestats"
            - name: VISITOR_STORAGE_CONTAINER
              value: "stats"
            - name: VISITOR_BLOB_NAME
              value: "visitors.json"
          # No capabilities are needed: the binary listens on 8080, above the
          # privileged-port boundary, and touches nothing else the kernel
          # gates. Verified by running this exact image under --read-only
          # --cap-drop ALL --user 65532 before committing - all four routes
          # still served.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              # Memory only, deliberately. CPU is compressible - a runaway can
              # only slow this pod down, never take the node out - and a CFS
              # quota would throttle request latency for nothing in return.
              # Memory is not compressible, which is exactly why it gets a
              # ceiling and CPU doesn't.
              #
              # 64Mi against a 14.7Mi peak working set measured over the last
              # 15 days (8Mi typical, and the Go runtime reserves ~13Mi of
              # that). Roughly 4x headroom, while still small enough that this
              # pod can't threaten a single node it shares with Prometheus,
              # Grafana and Alertmanager - which is the whole point of setting
              # it. Re-measure before assuming this number still fits.
              memory: 64Mi
          # Two endpoints on purpose. /readyz answers "should this pod receive
          # traffic?" and flips to 503 on SIGTERM so kubelet removes it from
          # the Service's endpoints before the server stops accepting.
          # /status answers "is this process alive?" and stays 200 throughout
          # the drain - a pod leaving deliberately is not a wedged process to
          # restart. One shared endpoint has to answer one of those wrongly.
          #
          # periodSeconds here is what drainDelay in app/main.go is sized
          # against: 6s covers one 5s readiness period plus slack.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
