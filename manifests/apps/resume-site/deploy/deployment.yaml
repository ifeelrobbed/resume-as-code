apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-site
  namespace: resume-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-site
  template:
    metadata:
      labels:
        app: resume-site
    spec:
      containers:
        - name: resume-site
          # Bump this tag in a PR to deploy - same as any other GitOps
          # change (see ARCHITECTURE.md "GitOps bootstrap and upgrade
          # path"). Release tags (vX.Y.Z) are retagged copies of an
          # already-built sha- image (see app-release.yml) - readable for
          # a human scanning `kubectl get deploy -o yaml`, but unlike a
          # sha- tag, nothing stops the registry tag itself from being
          # overwritten later. Use a sha- tag instead of a version tag
          # here if that mutability ever actually matters.
          image: ghcr.io/ifeelrobbed/resume-as-code:sha-e4a414f
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
