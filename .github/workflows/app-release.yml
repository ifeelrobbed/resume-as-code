name: app-release

# Separate from app-ci.yml deliberately: combining branches/tags/paths in one
# push trigger is a known GitHub Actions footgun (paths filters can silently
# apply to tag pushes too, based on the diff since the ref's previous
# position, and skip the run). A tag push is rare and deliberate - no need
# for path-based filtering here anyway.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=semver,pattern=v{{version}}

      # The tagged commit already has a sha-<shortsha> image from app-ci.yml's
      # normal build (every push to master builds one) - point the version
      # tag at that exact image instead of rebuilding, so v1.0.0 and its sha
      # tag are guaranteed to be the same bytes, not just the same source.
      - name: retag the existing sha- image as the version
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA:0:7}
