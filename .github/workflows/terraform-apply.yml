name: terraform-apply

on:
  push:
    branches: [master]
    paths:
      - "infra/**"
      # Markdown under infra/ is documentation, not infrastructure. Without
      # this, editing infra/README.md queued a production apply and left it
      # waiting on the environment's required reviewer - asking for approval
      # of a deploy whose entire diff was prose. That is worse than the wasted
      # run: an approval gate only works while every prompt is worth reading,
      # and one that fires on documentation teaches you to click through.
      #
      # Negation is supported in paths filters and later patterns win, so the
      # workflow's own entry below still matches.
      - "!infra/**.md"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    # Required reviewer on this environment is the actual approval gate -
    # it blocks the job (and therefore the OIDC token exchange) until
    # someone approves, same as any other merge-to-master change.
    environment: production
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra/envs/prod
        run: terraform init

      - name: terraform validate
        working-directory: infra/envs/prod
        run: terraform validate

      - name: terraform apply
        working-directory: infra/envs/prod
        run: terraform apply -input=false -auto-approve
