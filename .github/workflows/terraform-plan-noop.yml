# terraform-plan.yml only runs when infra/ changes, but a required status
# check that never reports for a commit blocks that PR's merge forever -
# this covers the complementary case (any PR that doesn't touch infra/)
# so "plan" always reports something. Same mutual-exclusivity-by-path
# trick manifests-ci.yml/app-ci.yml use by sharing the "build" job name,
# just for a third, independent check instead of two alternatives of the
# same one.
name: terraform-plan-noop

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - run: echo "No infra/ changes in this PR - nothing to plan."
